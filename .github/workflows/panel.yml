name: panel

# The panel app for Android (panel/): an APK on every change to it or to the
# runtime it runs, as an artifact of the run (gh run download -n iva-panel-apk);
# a release's too (release.yml calls it). Signed with the release key from the
# repository's secrets; without them (a fork), with the dev key in the repo.
on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'panel/**'
      - 'src/runtime/**'
      - 'src/preview/fonts.ts'
      - 'src/compiler/fonts.json'
      # the built-in demo (scripts/demo.mjs): the gallery and iva/ui
      - 'examples/gallery/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/panel.yml'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Rust targets (aarch64: phones and tablets since ~2017; armv7: older 32-bit ones)'
        default: 'aarch64'
  workflow_call:

concurrency:
  group: panel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: panel/src-tauri -> target

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
          cache-dependency-path: panel/src-tauri/gen/android/**/*.gradle*

      # (its default packages name 'tools', which today's SDK command-line tools don't have)
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - run: npm ci

      # the release key: a release (a v* tag) is never signed with the dev key
      - name: The release key
        env:
          KEYSTORE_B64: ${{ secrets.IVA_PANEL_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/iva-panel-release.p12"
            echo "IVA_PANEL_KEYSTORE=$RUNNER_TEMP/iva-panel-release.p12" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::no release key (secret IVA_PANEL_KEYSTORE_B64) for a release"
            exit 1
          else
            echo "no release key: the dev key signs this build"
          fi

      - name: Build the APK
        working-directory: panel
        env:
          IVA_PANEL_KEYSTORE_PASSWORD: ${{ secrets.IVA_PANEL_KEYSTORE_PASSWORD }}
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK_HOME"
          targets="${{ github.event.inputs.targets || 'aarch64' }}"
          npx tauri android build --apk $(for t in $targets; do printf -- '--target %s ' "$t"; done)

      - uses: actions/upload-artifact@v4
        with:
          name: iva-panel-apk
          path: panel/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
